<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title>Orphira — Console Debugger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03050a;
      --bg-gradient: linear-gradient(145deg, #020305 0%, #05070d 45%, #080a14 80%, #04060e 100%);
      --card-bg: rgba(14, 18, 30, 0.45);
      --card-hover: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(129, 140, 248, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #52617a;
      
      --accent-indigo: #818cf8;
      --accent-indigo-glow: rgba(129, 140, 248, 0.25);
      --accent-cyan: #93c5fd;
      --accent-amber: #e2b17a;
      --accent-green: #34d399;
      --accent-red: #fb7185;
      
      --font-ui: 'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* Живое амбиентное свечение */
    body::before {
      content: "";
      position: fixed;
      top: -10%;
      left: 20%;
      width: 50vw;
      height: 50vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.08) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Шапка управления */
    .debug-header {
      position: relative;
      z-index: 10;
      padding: 12px 18px;
      background: rgba(6, 9, 18, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .header-title {
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      max-width: 280px;
      background: rgba(10, 14, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      color: #fff;
      outline: none;
      font-size: 12px;
      font-family: var(--font-ui);
      transition: all 0.25s ease;
    }

    .search-box:focus {
      border-color: var(--border-focus);
      background: rgba(14, 18, 32, 0.85);
      box-shadow: 0 0 15px var(--accent-indigo-glow);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-ui);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(129, 140, 248, 0.12);
      border-color: rgba(129, 140, 248, 0.35);
      color: #ffffff;
    }

    .btn.active {
      background: rgba(129, 140, 248, 0.22);
      color: #ffffff;
      border-color: var(--accent-indigo);
      box-shadow: 0 0 12px var(--accent-indigo-glow);
    }

    /* Фильтры категорий */
    .category-bar {
      position: relative;
      z-index: 10;
      padding: 10px 18px;
      background: rgba(4, 6, 13, 0.5);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .chip {
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .chip:hover {
      color: var(--text-secondary);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
    }

    .chip.active {
      background: rgba(129, 140, 248, 0.18);
      color: var(--accent-indigo);
      border-color: var(--accent-indigo);
      box-shadow: 0 0 10px var(--accent-indigo-glow);
    }

    /* Поток логов */
    .log-stream {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
    }

    .log-row {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(12, 16, 28, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left: 3px solid var(--accent-cyan);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .log-row:hover {
      background: rgba(20, 26, 42, 0.65);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateX(2px);
    }

    .log-row.info { border-left-color: var(--accent-indigo); }
    .log-row.success { border-left-color: var(--accent-green); }
    .log-row.warn { border-left-color: var(--accent-amber); }
    .log-row.error { border-left-color: var(--accent-red); background: rgba(251, 113, 133, 0.06); }

    .log-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .log-time {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .log-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .log-row.info .log-badge { color: var(--accent-indigo); background: rgba(129, 140, 248, 0.12); border-color: rgba(129, 140, 248, 0.25); }
    .log-row.success .log-badge { color: var(--accent-green); background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.25); }
    .log-row.warn .log-badge { color: var(--accent-amber); background: rgba(226, 177, 122, 0.12); border-color: rgba(226, 177, 122, 0.25); }
    .log-row.error .log-badge { color: var(--accent-red); background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.25); }

    .log-msg {
      flex: 1;
      color: var(--text-primary);
      word-break: break-word;
      font-weight: 500;
    }

    .log-details {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(3, 5, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      color: #93c5fd;
      font-size: 11px;
      white-space: pre-wrap;
      display: none;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .log-row.expanded .log-details { display: block; }

    /* Скроллбар */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
  </style>
</head>
<body>
  <div class="debug-header">
    <div class="header-title">
 <span>Orphira Debugger</span>
    </div>
    <input type="text" id="search-input" class="search-box" placeholder="Поиск в логах...">
    <div class="controls-group">
      <button class="btn active" id="btn-autoscroll">Auto-Scroll</button>
      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn" id="btn-copy">Copy All</button>
      <button class="btn" id="btn-clear">Clear</button>
    </div>
  </div>
  <div class="category-bar">
    <div class="chip active" data-cat="ALL">ALL</div>
    <div class="chip" data-cat="LYRICS">LYRICS</div>
    <div class="chip" data-cat="SYSTEM">SYSTEM</div>
    <div class="chip" data-cat="AUDIO">AUDIO</div>
    <div class="chip" data-cat="IPC">IPC</div>
    <div class="chip" data-cat="ERROR">ERRORS</div>
  </div>
  <div class="log-stream" id="log-stream"></div>

  <script>
    const { ipcRenderer, clipboard } = require('electron');
    let logs = [];
    let activeCategory = 'ALL';
    let searchQuery = '';
    let autoScroll = true;
    let isPaused = false;

    const streamEl = document.getElementById('log-stream');
    const searchInput = document.getElementById('search-input');
    const btnAutoScroll = document.getElementById('btn-autoscroll');
    const btnPause = document.getElementById('btn-pause');
    const btnCopy = document.getElementById('btn-copy');
    const btnClear = document.getElementById('btn-clear');

    async function init() {
      logs = await ipcRenderer.invoke('debug:get-logs');
      renderLogs();
    }

    function renderLogs() {
      streamEl.innerHTML = '';
      const filtered = logs.filter(item => {
        const matchCat = activeCategory === 'ALL' || item.category === activeCategory || (activeCategory === 'ERROR' && item.level === 'error');
        const matchSearch = !searchQuery || item.message.toLowerCase().includes(searchQuery) || (item.details && item.details.toLowerCase().includes(searchQuery));
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = `log-row ${item.level}`;
        row.innerHTML = `
          <div class="log-header">
            <span class="log-time">${item.timestamp}</span>
            <span class="log-badge">${item.category}</span>
            <span class="log-msg">${escapeHtml(item.message)}</span>
          </div>
          ${item.details ? `<div class="log-details">${escapeHtml(item.details)}</div>` : ''}
        `;
        if (item.details) {
          row.addEventListener('click', () => row.classList.toggle('expanded'));
        }
        streamEl.appendChild(row);
      });

      if (autoScroll && !isPaused) {
        streamEl.scrollTop = streamEl.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    ipcRenderer.on('debug:new-log', (e, logEntry) => {
      logs.push(logEntry);
      if (logs.length > 1000) logs.shift();
      if (!isPaused) {
        renderLogs();
      }
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCategory = chip.dataset.cat;
        renderLogs();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderLogs();
    });

    btnAutoScroll.addEventListener('click', () => {
      autoScroll = !autoScroll;
      btnAutoScroll.classList.toggle('active', autoScroll);
    });

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.classList.toggle('active', isPaused);
      btnPause.textContent = isPaused ? 'Resume' : 'Pause';
    });

    btnClear.addEventListener('click', async () => {
      await ipcRenderer.invoke('debug:clear-logs');
      logs = [];
      renderLogs();
    });

    btnCopy.addEventListener('click', () => {
      const text = logs.map(l => `[${l.timestamp}] [${l.category}] [${l.level.toUpperCase()}]: ${l.message} ${l.details || ''}`).join('\n');
      clipboard.writeText(text);
      btnCopy.textContent = 'Copied!';
      setTimeout(() => btnCopy.textContent = 'Copy All', 1500);
    });

    init();
  </script>
</body>
</html>
