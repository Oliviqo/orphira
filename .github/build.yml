name: Build Orphira

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: Orphira-Windows-x64

          - name: macOS x64
            os: macos-15-intel
            command: npm run dist:mac:x64
            artifact: Orphira-macOS-x64

          - name: macOS ARM64
            os: macos-latest
            command: npm run dist:mac:arm64
            artifact: Orphira-macOS-arm64

          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux:x64
            artifact: Orphira-Linux-x64

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run dist:linux:arm64
            artifact: Orphira-Linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore fpcalc executable permission
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x src/main/assets/fpcalc/darwin-x64/fpcalc
          chmod +x src/main/assets/fpcalc/darwin-arm64/fpcalc
          chmod +x src/main/assets/fpcalc/linux-x64/fpcalc
          chmod +x src/main/assets/fpcalc/linux-arm64/fpcalc

      - name: Build application
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14